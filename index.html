<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyAI — Нейросеть</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 40%, #1a1f35, #07090f);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 500px;
            background: rgba(12, 16, 35, 0.8);
            backdrop-filter: blur(24px);
            border-radius: 40px;
            padding: 30px;
            border: 1px solid rgba(0, 180, 255, 0.2);
        }
        .logo { text-align: center; margin-bottom: 20px; }
        .logo-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #0088ff, #4400ff);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; font-weight: 800; color: white;
            margin: 0 auto 10px;
        }
        .logo h1 { font-size: 28px; background: linear-gradient(90deg, #00ccff, #7766ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo p { color: #667799; font-size: 13px; }
        .hidden { display: none !important; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; color: #8899bb; font-size: 13px; margin-bottom: 4px; }
        .form-group input {
            width: 100%; padding: 12px 16px; border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.35);
            color: #e0e8ff; font-size: 14px; outline: none;
        }
        .form-group input:focus { border-color: rgba(0,180,255,0.4); }

        .btn {
            width: 100%; padding: 14px; border-radius: 30px; border: none;
            background: linear-gradient(135deg, #0088ff, #5500ff);
            color: white; font-weight: 600; font-size: 15px; cursor: pointer;
        }
        .btn:hover { transform: scale(1.02); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .switch { text-align: center; margin-top: 12px; color: #667799; font-size: 13px; cursor: pointer; }
        .switch span { color: #88ddff; text-decoration: underline; }

        .message { padding: 12px; border-radius: 12px; text-align: center; font-size: 13px; margin-top: 10px; }
        .message.success { background: rgba(0,255,150,0.08); color: #66ffaa; }
        .message.error { background: rgba(255,50,50,0.08); color: #ff6666; }

        .chat-box {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 14px;
            height: 280px;
            overflow-y: auto;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .chat-box::-webkit-scrollbar { width: 4px; }
        .chat-box::-webkit-scrollbar-thumb { background: rgba(0,180,255,0.3); border-radius: 10px; }

        .msg { margin-bottom: 8px; display: flex; flex-direction: column; }
        .msg.user { align-items: flex-end; }
        .msg.ai { align-items: flex-start; }
        .msg .bubble {
            max-width: 80%;
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .msg.user .bubble { background: linear-gradient(135deg, #0088ff, #5500ff); color: white; border-bottom-right-radius: 4px; }
        .msg.ai .bubble { background: rgba(255,255,255,0.07); color: #e0e8ff; border-bottom-left-radius: 4px; }
        .msg .label { font-size: 10px; color: #667799; margin-bottom: 2px; }

        .input-area { display: flex; gap: 8px; }
        .input-area input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.35);
            color: #e0e8ff;
            font-size: 13px;
            outline: none;
        }
        .input-area input:focus { border-color: rgba(0,180,255,0.4); }
        .input-area button { padding: 10px 20px; border-radius: 30px; border: none; background: linear-gradient(135deg, #0088ff, #5500ff); color: white; font-weight: 600; font-size: 13px; cursor: pointer; }

        .status-box {
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 12px;
            text-align: center;
            font-size: 13px;
        }
        .status-box.active { background: rgba(0,255,150,0.08); color: #66ffaa; }
        .status-box.inactive { background: rgba(255,200,0,0.08); color: #ccaa66; }

        .typing {
            display: none;
            padding: 6px 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 30px;
            width: fit-content;
            margin-top: 4px;
        }
        .typing span {
            display: inline-block;
            width: 6px; height: 6px;
            background: #6699ff;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite both;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="card" id="app">
        <div class="logo">
            <div class="logo-icon">Py</div>
            <h1>PyAI</h1>
            <p>Нейросеть нового поколения</p>
        </div>

        <div id="authForm">
            <div id="authTitle" style="text-align:center;color:#8899bb;font-size:16px;margin-bottom:16px;">Вход</div>
            <div class="form-group">
                <label>👤 Имя</label>
                <input type="text" id="username" placeholder="Введите имя" />
            </div>
            <div class="form-group">
                <label>🔑 Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль" />
            </div>
            <button class="btn" id="authBtn">Войти</button>
            <div class="switch" id="switchBtn">Нет аккаунта? <span>Зарегистрироваться</span></div>
            <div id="authMessage" class="message"></div>
        </div>

        <div id="chatArea" class="hidden">
            <div class="status-box" id="statusBox">🔄 Загрузка...</div>
            <div class="chat-box" id="chatBox">
                <div class="msg ai">
                    <span class="label">🧠 PyAI</span>
                    <div class="bubble">Привет! Я PyAI. Задавай любые вопросы!</div>
                </div>
                <div class="typing" id="typing"><span></span><span></span><span></span></div>
            </div>
            <div class="input-area">
                <input type="text" id="messageInput" placeholder="Спроси у PyAI..." />
                <button id="sendBtn">➤</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;

        const authForm = document.getElementById('authForm');
        const chatArea = document.getElementById('chatArea');
        const authTitle = document.getElementById('authTitle');
        const authBtn = document.getElementById('authBtn');
        const switchBtn = document.getElementById('switchBtn');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const authMessage = document.getElementById('authMessage');
        const statusBox = document.getElementById('statusBox');
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typing = document.getElementById('typing');

        let isLogin = true;

        function showMessage(text, type) {
            authMessage.textContent = text;
            authMessage.className = 'message ' + type;
        }

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            const label = document.createElement('span');
            label.className = 'label';
            label.textContent = role === 'user' ? '👤 Вы' : '🧠 PyAI';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            div.appendChild(label);
            div.appendChild(bubble);
            chatBox.insertBefore(div, typing);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !currentUser) return;

            addMessage('user', text);
            messageInput.value = '';
            sendBtn.disabled = true;
            typing.style.display = 'flex';

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser, message: text })
                });
                const data = await res.json();
                if (data.success) {
                    addMessage('ai', data.response);
                } else {
                    addMessage('ai', '❌ ' + data.error);
                }
            } catch (e) {
                addMessage('ai', '❌ Ошибка: ' + e.message);
            } finally {
                typing.style.display = 'none';
                sendBtn.disabled = false;
            }
        }

        async function login() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                showMessage('Заполните все поля', 'error');
                return;
            }

            authBtn.disabled = true;
            authBtn.textContent = '⏳...';

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    currentUser = username;
                    authForm.classList.add('hidden');
                    chatArea.classList.remove('hidden');
                    
                    if (data.status === 'active') {
                        statusBox.className = 'status-box active';
                        statusBox.textContent = `✅ Активна | ${data.plan} | ${data.days_left === '∞' ? '♾️ Вечная' : data.days_left + ' дн.'}`;
                    } else {
                        statusBox.className = 'status-box inactive';
                        statusBox.textContent = '❌ Подписка неактивна. Напишите @cursed_pharaon для продления';
                    }
                } else {
                    showMessage('❌ ' + data.error, 'error');
                }
            } catch (e) {
                showMessage('❌ Ошибка: ' + e.message, 'error');
            } finally {
                authBtn.disabled = false;
                authBtn.textContent = isLogin ? 'Войти' : 'Зарегистрироваться';
            }
        }

        async function register() {
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                showMessage('Заполните все поля', 'error');
                return;
            }

            if (password.length < 4) {
                showMessage('Пароль должен быть не менее 4 символов', 'error');
                return;
            }

            authBtn.disabled = true;
            authBtn.textContent = '⏳...';

            try {
                const res = await fetch('/register_web', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    showMessage('✅ ' + data.message, 'success');
                    usernameInput.value = '';
                    passwordInput.value = '';
                    isLogin = true;
                    authTitle.textContent = 'Вход';
                    authBtn.textContent = 'Войти';
                    switchBtn.innerHTML = 'Нет аккаунта? <span>Зарегистрироваться</span>';
                } else {
                    showMessage('❌ ' + data.error, 'error');
                }
            } catch (e) {
                showMessage('❌ Ошибка: ' + e.message, 'error');
            } finally {
                authBtn.disabled = false;
                authBtn.textContent = isLogin ? 'Войти' : 'Зарегистрироваться';
            }
        }

        switchBtn.addEventListener('click', function() {
            isLogin = !isLogin;
            if (isLogin) {
                authTitle.textContent = 'Вход';
                authBtn.textContent = 'Войти';
                switchBtn.innerHTML = 'Нет аккаунта? <span>Зарегистрироваться</span>';
                showMessage('', '');
            } else {
                authTitle.textContent = 'Регистрация';
                authBtn.textContent = 'Зарегистрироваться';
                switchBtn.innerHTML = 'Уже есть аккаунт? <span>Войти</span>';
                showMessage('', '');
            }
        });

        authBtn.addEventListener('click', function() {
            if (isLogin) {
                login();
            } else {
                register();
            }
        });

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        usernameInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') authBtn.click();
        });
        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') authBtn.click();
        });
    </script>
</body>
</html>
