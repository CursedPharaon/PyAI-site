<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PyAI — Нейросеть</title>
    <!-- Подключаем Highlight.js для подсветки кода -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Подключаем Marked.js для парсинга Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ===== ГЛОБАЛЬНЫЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        /* ===== ШАПКА ===== */
        .header {
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            min-height: 50px;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #0066ff, #4400ff);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: white;
        }

        .logo h1 {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .logo h1 span {
            color: #0066ff;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .header-right .btn-menu {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #495057;
            padding: 0 4px;
            display: none;
        }

        .user-info {
            font-size: 12px;
            color: #495057;
        }

        .user-info strong {
            color: #1a1a2e;
        }

        .status-badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-badge.active {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .status-badge.admin {
            background: #cce5ff;
            color: #004085;
        }

        .btn {
            padding: 4px 12px;
            border-radius: 6px;
            border: none;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #dee2e6;
            color: #495057;
        }

        .btn-outline:hover {
            background: #f1f3f5;
        }

        .btn-primary {
            background: #0066ff;
            color: white;
        }

        .btn-primary:hover {
            background: #0052cc;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 6px;
        }

        /* ===== МОБИЛЬНОЕ МЕНЮ ЧАТОВ ===== */
        .mobile-chat-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.3);
            z-index: 100;
            animation: fadeIn 0.2s ease;
        }

        .mobile-chat-overlay.open {
            display: block;
        }

        .mobile-chat-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100%;
            background: #f8f9fa;
            z-index: 101;
            padding: 20px 16px;
            overflow-y: auto;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            box-shadow: 2px 0 12px rgba(0,0,0,0.1);
        }

        .mobile-chat-menu.open {
            transform: translateX(0);
        }

        .mobile-chat-menu .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .mobile-chat-menu .menu-header h3 {
            font-size: 16px;
            color: #1a1a2e;
        }

        .mobile-chat-menu .menu-header .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6c757d;
        }

        .mobile-chat-menu .chat-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin: 2px 0;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border: 1px solid #e9ecef;
        }

        .mobile-chat-menu .chat-item:hover {
            background: #e9ecef;
        }

        .mobile-chat-menu .chat-item.active {
            background: #d4edda;
            border-color: #28a745;
            font-weight: 600;
        }

        .mobile-chat-menu .chat-item .delete-chat {
            color: #dc3545;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
        }

        .mobile-chat-menu .chat-item .delete-chat:hover {
            color: #c82333;
        }

        .mobile-chat-menu .new-chat-btn {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            border-radius: 8px;
            border: 2px dashed #dee2e6;
            background: transparent;
            color: #495057;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .mobile-chat-menu .new-chat-btn:hover {
            background: #e9ecef;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
        .main-container {
            display: flex;
            flex-direction: column;
            height: calc(100% - 50px);
            overflow: hidden;
        }

        /* ===== БОКОВАЯ ПАНЕЛЬ (десктоп) ===== */
        .sidebar {
            display: none;
        }

        /* ===== ОСНОВНАЯ ОБЛАСТЬ ===== */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            min-height: 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        /* ===== СООБЩЕНИЯ ===== */
        .message {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            max-width: 100%;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.ai {
            align-items: flex-start;
        }

        .message .bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            max-width: 100%;
            overflow-wrap: break-word;
            width: 100%;
        }

        .message.user .bubble {
            background: #0066ff;
            color: white;
            border-bottom-right-radius: 4px;
            max-width: 85%;
        }

        .message.ai .bubble {
            background: #f1f3f5;
            color: #1a1a2e;
            border-bottom-left-radius: 4px;
            max-width: 95%;
        }

        .message .label {
            font-size: 10px;
            color: #6c757d;
            margin-bottom: 2px;
            padding: 0 4px;
        }

        /* ===== MARKDOWN СТИЛИ ===== */
        .message .bubble h1,
        .message .bubble h2,
        .message .bubble h3,
        .message .bubble h4 {
            margin: 8px 0 4px 0;
            font-weight: 700;
        }
        .message .bubble h1 { font-size: 22px; }
        .message .bubble h2 { font-size: 18px; }
        .message .bubble h3 { font-size: 16px; }
        .message .bubble h4 { font-size: 14px; }

        .message .bubble p {
            margin: 4px 0;
        }

        .message .bubble strong {
            font-weight: 700;
            color: #1a1a2e;
        }

        .message .bubble em {
            font-style: italic;
        }

        .message .bubble ul,
        .message .bubble ol {
            padding-left: 24px;
            margin: 6px 0;
        }

        .message .bubble li {
            margin: 3px 0;
        }

        .message .bubble blockquote {
            border-left: 4px solid #0066ff;
            padding: 8px 16px;
            margin: 8px 0;
            background: #f8f9fa;
            border-radius: 0 8px 8px 0;
            color: #495057;
        }

        .message .bubble table {
            border-collapse: collapse;
            width: 100%;
            margin: 8px 0;
            font-size: 13px;
            display: block;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .message .bubble th,
        .message .bubble td {
            border: 1px solid #dee2e6;
            padding: 6px 12px;
            text-align: left;
        }

        .message .bubble th {
            background: #f1f3f5;
            font-weight: 600;
        }

        .message .bubble tr:nth-child(even) {
            background: #f8f9fa;
        }

        .message .bubble a {
            color: #0066ff;
            text-decoration: underline;
        }

        .message .bubble a:hover {
            color: #0052cc;
        }

        .message .bubble hr {
            border: none;
            border-top: 1px solid #e9ecef;
            margin: 8px 0;
        }

        /* ===== КОД (с Highlight.js) ===== */
        .message .bubble pre {
            background: #1e1e2e;
            border-radius: 10px;
            padding: 16px;
            overflow-x: auto;
            margin: 8px 0;
            position: relative;
        }

        .message .bubble pre code {
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.5;
            color: #cdd6f4;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #cdd6f4;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .copy-btn.copied {
            background: #a6e3a1;
            color: #1a1a2e;
        }

        /* ===== ВВОД ===== */
        .chat-input {
            padding: 10px 14px;
            border-top: 1px solid #e9ecef;
            background: #f8f9fa;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .chat-input input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #dee2e6;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            background: white;
            min-width: 0;
        }

        .chat-input input:focus {
            border-color: #0066ff;
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
        }

        .chat-input button {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            background: #0066ff;
            color: white;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .chat-input button:hover {
            background: #0052cc;
        }

        .chat-input button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== АДМИН-ПАНЕЛЬ ===== */
        .admin-panel {
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            padding: 10px 14px;
            display: none;
            flex-shrink: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .admin-panel.show {
            display: block;
        }

        .admin-panel h3 {
            font-size: 12px;
            color: #6c757d;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .admin-panel .admin-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }

        .admin-panel .admin-actions .btn {
            font-size: 11px;
            padding: 4px 12px;
        }

        .admin-panel .admin-result {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
            max-height: 100px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        /* ===== АВТОРИЗАЦИЯ ===== */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            background: #f8f9fa;
            padding: 16px;
        }

        .auth-card {
            background: white;
            border-radius: 16px;
            padding: 24px 20px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            border: 1px solid #e9ecef;
        }

        .auth-card .logo {
            justify-content: center;
            margin-bottom: 16px;
        }

        .auth-card .logo .logo-icon {
            width: 40px;
            height: 40px;
            font-size: 20px;
        }

        .auth-card .logo h1 {
            font-size: 22px;
        }

        .auth-card h2 {
            font-size: 18px;
            color: #1a1a2e;
            margin-bottom: 4px;
            text-align: center;
        }

        .auth-card p {
            color: #6c757d;
            font-size: 13px;
            text-align: center;
            margin-bottom: 16px;
        }

        .auth-card .form-group {
            margin-bottom: 12px;
        }

        .auth-card .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #495057;
            margin-bottom: 3px;
        }

        .auth-card .form-group input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .auth-card .form-group input:focus {
            border-color: #0066ff;
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
        }

        .auth-card .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .auth-card .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #0066ff;
            cursor: pointer;
        }

        .auth-card .checkbox-group label {
            font-size: 13px;
            color: #495057;
            cursor: pointer;
        }

        .auth-card .btn {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border-radius: 8px;
            border: none;
            background: #0066ff;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .auth-card .btn:hover {
            background: #0052cc;
        }

        .auth-card .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .auth-card .switch {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            color: #6c757d;
            cursor: pointer;
        }

        .auth-card .switch span {
            color: #0066ff;
            font-weight: 600;
        }

        .auth-card .switch span:hover {
            text-decoration: underline;
        }

        .auth-card .message {
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .auth-card .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
        }

        .auth-card .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
        }

        /* ===== СТИЛИ ДЛЯ ЧАТОВ В САЙДБАРЕ ===== */
        .sidebar-chats {
            max-height: 180px;
            overflow-y: auto;
        }
        .sidebar-chats .chat-item {
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin: 2px 0;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-chats .chat-item:hover {
            background: #e9ecef;
        }
        .sidebar-chats .chat-item.active {
            background: #d4edda;
            font-weight: 600;
        }
        .sidebar-chats .chat-item .delete-chat {
            color: #dc3545;
            cursor: pointer;
            font-size: 11px;
            padding: 0 4px;
        }
        .sidebar-chats .chat-item .delete-chat:hover {
            color: #c82333;
        }
        .limit-info {
            font-size: 12px;
            color: #6c757d;
            margin-top: 6px;
        }
        .limit-info .remaining {
            font-weight: 700;
            color: #0066ff;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 767px) {
            .header-right .btn-menu {
                display: block;
            }
            .header-right .user-info {
                font-size: 11px;
            }
            .header-right .status-badge {
                font-size: 9px;
                padding: 2px 8px;
            }
            .sidebar {
                display: none !important;
            }
        }

        @media (min-width: 768px) {
            .header {
                padding: 12px 24px;
                min-height: 60px;
            }

            .header-right .btn-menu {
                display: none;
            }

            .logo-icon {
                width: 36px;
                height: 36px;
                font-size: 18px;
            }

            .logo h1 {
                font-size: 20px;
            }

            .user-info {
                font-size: 14px;
            }

            .status-badge {
                font-size: 12px;
                padding: 4px 14px;
            }

            .btn {
                font-size: 13px;
                padding: 6px 16px;
            }

            .main-container {
                flex-direction: row;
                height: calc(100% - 60px);
            }

            .sidebar {
                display: flex;
                flex-direction: column;
                width: 220px;
                background: #f8f9fa;
                border-right: 1px solid #e9ecef;
                padding: 16px;
                overflow-y: auto;
                flex-shrink: 0;
                gap: 12px;
            }

            .sidebar-card {
                background: white;
                border-radius: 10px;
                padding: 14px;
                border: 1px solid #e9ecef;
            }

            .sidebar-card h3 {
                font-size: 11px;
                color: #6c757d;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                margin-bottom: 6px;
            }

            .sidebar-card p {
                font-size: 13px;
                color: #1a1a2e;
            }

            .sidebar-card .value {
                font-size: 16px;
                font-weight: 700;
            }

            .quick-actions {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .quick-actions button {
                padding: 8px 12px;
                border-radius: 6px;
                border: 1px solid #e9ecef;
                background: white;
                color: #1a1a2e;
                font-size: 12px;
                cursor: pointer;
                transition: 0.2s;
                text-align: left;
            }

            .quick-actions button:hover {
                background: #f1f3f5;
            }

            .chat-messages {
                padding: 20px 24px;
            }

            .message .bubble {
                font-size: 15px;
                padding: 12px 18px;
            }

            .message.ai .bubble {
                max-width: 85%;
            }

            .chat-input {
                padding: 16px 24px;
            }

            .chat-input input {
                font-size: 15px;
                padding: 12px 18px;
            }

            .chat-input button {
                padding: 12px 28px;
                font-size: 15px;
            }

            .auth-card {
                padding: 40px;
                max-width: 400px;
            }

            .admin-panel {
                padding: 12px 24px;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #dee2e6;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ced4da;
        }
    </style>
</head>
<body>

    <!-- ===== МОБИЛЬНОЕ МЕНЮ ЧАТОВ (оверлей) ===== -->
    <div class="mobile-chat-overlay" id="mobileChatOverlay">
        <div class="mobile-chat-menu" id="mobileChatMenu">
            <div class="menu-header">
                <h3>💬 Чаты</h3>
                <button class="close-btn" id="closeMobileChat">✕</button>
            </div>
            <div id="mobileChatList">
                <div style="color:#6c757d;font-size:14px;text-align:center;padding:20px 0;">Загрузка...</div>
            </div>
            <button class="new-chat-btn" id="mobileNewChatBtn">➕ Новый чат</button>
        </div>
    </div>

    <!-- ===== ШАПКА ===== -->
    <header class="header" id="header" style="display:none;">
        <div class="logo">
            <div class="logo-icon">Py</div>
            <h1>Py<span>AI</span></h1>
        </div>
        <div class="header-right">
            <button class="btn-menu" id="openMobileChat">☰</button>
            <span class="user-info" id="userInfo"><strong id="usernameDisplay"></strong></span>
            <span class="status-badge" id="statusBadge">🔴 Неактивна</span>
            <button class="btn btn-outline" id="logoutBtn">🚪</button>
        </div>
    </header>

    <!-- ===== ОСНОВНАЯ ОБЛАСТЬ ===== -->
    <div class="main-container" id="mainContainer" style="display:none;">

        <!-- Боковая панель (десктоп) -->
        <aside class="sidebar">
            <div class="sidebar-card">
                <h3>📊 Подписка</h3>
                <p id="sidebarPlan">Нет</p>
                <p id="sidebarDays" style="font-size:12px;color:#6c757d;"></p>
                <div class="limit-info">📊 Осталось запросов: <span class="remaining" id="remainingCount">5</span></div>
            </div>

            <div class="sidebar-card">
                <h3>💬 Чаты</h3>
                <div class="sidebar-chats" id="chatList">
                    <div style="color:#6c757d;font-size:13px;">Загрузка...</div>
                </div>
                <button class="btn btn-primary btn-sm" style="width:100%;margin-top:6px;" id="newChatBtn">➕ Новый чат</button>
            </div>

            <div class="sidebar-card">
                <h3>📌 Действия</h3>
                <div class="quick-actions">
                    <button onclick="clearCurrentChat()">🧹 Очистить чат</button>
                    <button onclick="exportChat()">📥 Экспорт чата</button>
                </div>
            </div>

            <div class="sidebar-card" id="adminSidebar" style="display:none;">
                <h3>👑 Админ-панель</h3>
                <div class="quick-actions">
                    <button onclick="toggleAdminPanel()">⚙️ Открыть панель</button>
                </div>
            </div>
        </aside>

        <!-- Чат -->
        <div class="chat-area">
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">
                    <span class="label">🧠 PyAI</span>
                    <div class="bubble">Привет! Я PyAI. Задавай вопросы!</div>
                </div>
                <div class="typing" id="typing"><span></span><span></span><span></span></div>
            </div>

            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Спроси у PyAI..." />
                <button id="sendBtn">➤</button>
            </div>

            <!-- Админ-панель -->
            <div class="admin-panel" id="adminPanel">
                <h3>👑 Админ-панель</h3>
                <div class="admin-actions">
                    <button class="btn btn-success" onclick="adminListUsers()">📋 Список</button>
                    <button class="btn btn-primary" onclick="adminGiveAccess()">✅ Дать доступ</button>
                    <button class="btn btn-danger" onclick="adminRemoveAccess()">❌ Отключить</button>
                    <button class="btn btn-danger" onclick="adminDeleteUser()">🗑️ Удалить</button>
                    <button class="btn btn-outline" onclick="adminStats()">📊 Статистика</button>
                </div>
                <div class="admin-result" id="adminResult">Команды админа:</div>
            </div>
        </div>
    </div>

    <!-- ===== АВТОРИЗАЦИЯ ===== -->
    <div class="auth-container" id="authContainer">
        <div class="auth-card">
            <div class="logo">
                <div class="logo-icon">Py</div>
                <h1>Py<span style="color:#0066ff;">AI</span></h1>
            </div>
            <h2 id="authTitle">Вход</h2>
            <p id="authSubtitle">Войдите в аккаунт</p>

            <div class="form-group">
                <label>👤 Имя</label>
                <input type="text" id="authUsername" placeholder="Введите имя" />
            </div>
            <div class="form-group">
                <label>🔑 Пароль</label>
                <input type="password" id="authPassword" placeholder="Введите пароль" />
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="rememberMe" checked />
                <label for="rememberMe">Запомнить меня</label>
            </div>

            <button class="btn" id="authBtn">Войти</button>
            <div class="switch" id="switchBtn">Нет аккаунта? <span>Зарегистрироваться</span></div>
            <div class="message" id="authMessage"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // СОСТОЯНИЕ
        // ============================================================
        let currentUser = null;
        let isLogin = true;
        let isAdmin = false;
        let currentChatId = null;
        let allChats = [];
        let remainingRequests = 5;

        const ADMIN_NAME = "cursed_dev";

        // ============================================================
        // DOM
        // ============================================================
        const authContainer = document.getElementById('authContainer');
        const authTitle = document.getElementById('authTitle');
        const authSubtitle = document.getElementById('authSubtitle');
        const authUsername = document.getElementById('authUsername');
        const authPassword = document.getElementById('authPassword');
        const authBtn = document.getElementById('authBtn');
        const authMessage = document.getElementById('authMessage');
        const switchBtn = document.getElementById('switchBtn');
        const rememberMe = document.getElementById('rememberMe');

        const header = document.getElementById('header');
        const mainContainer = document.getElementById('mainContainer');
        const usernameDisplay = document.getElementById('usernameDisplay');
        const statusBadge = document.getElementById('statusBadge');

        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typing = document.getElementById('typing');

        const sidebarPlan = document.getElementById('sidebarPlan');
        const sidebarDays = document.getElementById('sidebarDays');
        const adminSidebar = document.getElementById('adminSidebar');
        const adminPanel = document.getElementById('adminPanel');
        const adminResult = document.getElementById('adminResult');
        const remainingCount = document.getElementById('remainingCount');
        const chatList = document.getElementById('chatList');

        // Мобильное меню
        const mobileChatOverlay = document.getElementById('mobileChatOverlay');
        const mobileChatMenu = document.getElementById('mobileChatMenu');
        const mobileChatList = document.getElementById('mobileChatList');
        const openMobileChatBtn = document.getElementById('openMobileChat');
        const closeMobileChatBtn = document.getElementById('closeMobileChat');
        const mobileNewChatBtn = document.getElementById('mobileNewChatBtn');

        // ============================================================
        // МОБИЛЬНОЕ МЕНЮ
        // ============================================================
        function openMobileMenu() {
            mobileChatOverlay.classList.add('open');
            mobileChatMenu.classList.add('open');
            renderMobileChatList();
        }

        function closeMobileMenu() {
            mobileChatOverlay.classList.remove('open');
            mobileChatMenu.classList.remove('open');
        }

        openMobileChatBtn.addEventListener('click', openMobileMenu);
        closeMobileChatBtn.addEventListener('click', closeMobileMenu);
        mobileChatOverlay.addEventListener('click', function(e) {
            if (e.target === this) closeMobileMenu();
        });

        function renderMobileChatList() {
            if (!allChats.length) {
                mobileChatList.innerHTML = '<div style="color:#6c757d;font-size:14px;text-align:center;padding:20px 0;">Нет чатов</div>';
                return;
            }
            let html = '';
            allChats.forEach(chat => {
                const active = chat.id === currentChatId ? 'active' : '';
                html += `
                    <div class="chat-item ${active}" onclick="switchChatMobile('${chat.id}')">
                        <span>${chat.title}</span>
                        <span class="delete-chat" onclick="event.stopPropagation();deleteChatMobile('${chat.id}')">✕</span>
                    </div>
                `;
            });
            mobileChatList.innerHTML = html;
        }

        async function switchChatMobile(chatId) {
            await switchChat(chatId);
            closeMobileMenu();
        }

        async function deleteChatMobile(chatId) {
            if (!confirm('Удалить этот чат?')) return;
            await deleteChat(chatId);
            renderMobileChatList();
        }

        mobileNewChatBtn.addEventListener('click', async function() {
            await createNewChat();
            closeMobileMenu();
        });

        // ============================================================
        // АВТОРИЗАЦИЯ
        // ============================================================
        function showAuthMessage(text, type) {
            authMessage.textContent = text;
            authMessage.className = 'message ' + type;
        }

        function switchMode() {
            isLogin = !isLogin;
            if (isLogin) {
                authTitle.textContent = 'Вход';
                authSubtitle.textContent = 'Войдите в аккаунт';
                authBtn.textContent = 'Войти';
                switchBtn.innerHTML = 'Нет аккаунта? <span>Зарегистрироваться</span>';
            } else {
                authTitle.textContent = 'Регистрация';
                authSubtitle.textContent = 'Создайте аккаунт';
                authBtn.textContent = 'Зарегистрироваться';
                switchBtn.innerHTML = 'Уже есть аккаунт? <span>Войти</span>';
            }
            showAuthMessage('', '');
        }

        async function handleAuth() {
            const username = authUsername.value.trim();
            const password = authPassword.value.trim();

            if (!username || !password) {
                showAuthMessage('Заполните все поля', 'error');
                return;
            }

            if (!isLogin && password.length < 4) {
                showAuthMessage('Пароль ≥ 4 символов', 'error');
                return;
            }

            authBtn.disabled = true;
            authBtn.textContent = '⏳';

            try {
                const endpoint = isLogin ? '/login' : '/register_web';
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    if (isLogin) {
                        currentUser = username;
                        if (rememberMe.checked) {
                            localStorage.setItem('pyai_user', username);
                        } else {
                            localStorage.removeItem('pyai_user');
                        }
                        showApp(data);
                        await loadChats();
                    } else {
                        showAuthMessage('✅ ' + data.message, 'success');
                        authUsername.value = '';
                        authPassword.value = '';
                        setTimeout(() => switchMode(), 1500);
                    }
                } else {
                    showAuthMessage('❌ ' + data.error, 'error');
                }
            } catch (error) {
                showAuthMessage('❌ Ошибка: ' + error.message, 'error');
            }

            authBtn.disabled = false;
            authBtn.textContent = isLogin ? 'Войти' : 'Зарегистрироваться';
        }

        function showApp(data) {
            authContainer.style.display = 'none';
            header.style.display = 'flex';
            mainContainer.style.display = 'flex';

            usernameDisplay.textContent = data.username;
            updateLimitInfo(5);

            if (data.username === ADMIN_NAME) {
                isAdmin = true;
                statusBadge.textContent = '👑 Админ';
                statusBadge.className = 'status-badge admin';
                adminSidebar.style.display = 'block';
                adminPanel.classList.add('show');
                adminResult.textContent = '👑 Добро пожаловать, Админ!';
            } else {
                isAdmin = false;
                adminSidebar.style.display = 'none';
                adminPanel.classList.remove('show');
            }

            if (data.status === 'active') {
                if (!isAdmin) {
                    statusBadge.textContent = '🟢 Активна';
                    statusBadge.className = 'status-badge active';
                }
                sidebarPlan.textContent = '📋 ' + data.plan;
                sidebarDays.textContent = data.days_left === '∞' ? '♾️ Вечная' : '⏳ ' + data.days_left + ' дн.';
            } else {
                if (!isAdmin) {
                    statusBadge.textContent = '🔴 Неактивна';
                    statusBadge.className = 'status-badge inactive';
                }
                sidebarPlan.textContent = '❌ Нет подписки';
                sidebarDays.textContent = 'Напишите @cursed_pharaon';
            }
        }

        // ============================================================
        // ФУНКЦИИ ДЛЯ ЧАТОВ
        // ============================================================
        async function loadChats() {
            if (!currentUser) return;
            try {
                const res = await fetch('/chats', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser })
                });
                const data = await res.json();
                if (data.success) {
                    allChats = data.chats || [];
                    renderChatList();
                    renderMobileChatList();
                    if (allChats.length > 0 && !currentChatId) {
                        currentChatId = allChats[0].id;
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        function renderChatList() {
            if (!allChats.length) {
                chatList.innerHTML = '<div style="color:#6c757d;font-size:13px;">Нет чатов</div>';
                return;
            }
            let html = '';
            allChats.forEach(chat => {
                const active = chat.id === currentChatId ? 'active' : '';
                html += `
                    <div class="chat-item ${active}" onclick="switchChat('${chat.id}')">
                        <span>${chat.title}</span>
                        <span class="delete-chat" onclick="event.stopPropagation();deleteChat('${chat.id}')">✕</span>
                    </div>
                `;
            });
            chatList.innerHTML = html;
        }

        async function switchChat(chatId) {
            if (!currentUser) return;
            try {
                const res = await fetch('/chats/switch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser, chat_id: chatId })
                });
                const data = await res.json();
                if (data.success) {
                    currentChatId = data.chat_id;
                    document.querySelectorAll('.message').forEach(el => el.remove());
                    data.history.forEach(msg => {
                        addMessage(msg.role === 'user' ? 'user' : 'ai', msg.content);
                    });
                    renderChatList();
                    renderMobileChatList();
                    updateLimitInfo(remainingRequests);
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function deleteChat(chatId) {
            if (!currentUser || !confirm('Удалить этот чат?')) return;
            try {
                const res = await fetch('/chats/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser, chat_id: chatId })
                });
                const data = await res.json();
                if (data.success) {
                    await loadChats();
                    if (allChats.length > 0) {
                        await switchChat(allChats[0].id);
                    } else {
                        currentChatId = null;
                        document.querySelectorAll('.message').forEach(el => el.remove());
                        addMessage('ai', 'Создайте новый чат!');
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function createNewChat() {
            if (!currentUser) return;
            try {
                const res = await fetch('/chats/new', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser })
                });
                const data = await res.json();
                if (data.success) {
                    await loadChats();
                    await switchChat(data.chat_id);
                    addMessage('ai', '🆕 Новый чат создан! Задавай вопрос.');
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function clearCurrentChat() {
            if (!currentUser || !currentChatId) return;
            if (!confirm('Очистить историю этого чата?')) return;
            try {
                const res = await fetch('/clear_history', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser, chat_id: currentChatId })
                });
                const data = await res.json();
                if (data.success) {
                    document.querySelectorAll('.message').forEach(el => el.remove());
                    addMessage('ai', '🧹 История чата очищена!');
                }
            } catch (e) {
                console.error(e);
            }
        }

        function updateLimitInfo(remaining) {
            if (remaining !== undefined) {
                remainingRequests = remaining;
            }
            remainingCount.textContent = remainingRequests;
        }

        // ============================================================
        // АДМИН-ФУНКЦИИ
        // ============================================================
        function toggleAdminPanel() {
            if (!isAdmin) return;
            adminPanel.classList.toggle('show');
        }

        async function adminListUsers() {
            if (!isAdmin) return;
            adminResult.textContent = '⏳ Загрузка...';
            try {
                const res = await fetch('/admin/listusers');
                const data = await res.json();
                adminResult.textContent = data.success ? '📋 Список:\n' + data.users : '❌ ' + data.error;
            } catch (e) {
                adminResult.textContent = '❌ Ошибка: ' + e.message;
            }
        }

        async function adminGiveAccess() {
            if (!isAdmin) return;
            const username = prompt('Введите имя:');
            if (!username) return;
            const plan = prompt('План (1-неделя, 2-месяц, 3-год, 4-вечная):');
            if (!plan || !['1','2','3','4'].includes(plan)) {
                adminResult.textContent = '❌ Неверный план';
                return;
            }
            adminResult.textContent = '⏳...';
            try {
                const res = await fetch('/admin/giveaccess', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, plan })
                });
                const data = await res.json();
                adminResult.textContent = data.success ? '✅ ' + data.message : '❌ ' + data.error;
            } catch (e) {
                adminResult.textContent = '❌ Ошибка: ' + e.message;
            }
        }

        async function adminRemoveAccess() {
            if (!isAdmin) return;
            const username = prompt('Введите имя:');
            if (!username) return;
            adminResult.textContent = '⏳...';
            try {
                const res = await fetch('/admin/removeaccess', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const data = await res.json();
                adminResult.textContent = data.success ? '✅ ' + data.message : '❌ ' + data.error;
            } catch (e) {
                adminResult.textContent = '❌ Ошибка: ' + e.message;
            }
        }

        async function adminDeleteUser() {
            if (!isAdmin) return;
            const username = prompt('Введите имя:');
            if (!username) return;
            if (!confirm(`Удалить ${username}?`)) return;
            adminResult.textContent = '⏳...';
            try {
                const res = await fetch('/admin/deleteuser', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const data = await res.json();
                adminResult.textContent = data.success ? '✅ ' + data.message : '❌ ' + data.error;
            } catch (e) {
                adminResult.textContent = '❌ Ошибка: ' + e.message;
            }
        }

        async function adminStats() {
            if (!isAdmin) return;
            adminResult.textContent = '⏳...';
            try {
                const res = await fetch('/admin/stats');
                const data = await res.json();
                adminResult.textContent = data.success ? '📊 Статистика:\n' + data.stats : '❌ ' + data.error;
            } catch (e) {
                adminResult.textContent = '❌ Ошибка: ' + e.message;
            }
        }

        // ============================================================
        // ЧАТ
        // ============================================================
        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = 'message ' + role;

            const label = document.createElement('span');
            label.className = 'label';
            label.textContent = role === 'user' ? '👤 Вы' : '🧠 PyAI';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            if (role === 'ai') {
                let html = marked.parse(content);
                bubble.innerHTML = html;
                
                bubble.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                    const pre = block.parentElement;
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-btn';
                    copyBtn.textContent = '📋';
                    copyBtn.onclick = function() {
                        navigator.clipboard.writeText(block.textContent).then(() => {
                            this.textContent = '✅';
                            this.classList.add('copied');
                            setTimeout(() => {
                                this.textContent = '📋';
                                this.classList.remove('copied');
                            }, 2000);
                        });
                    };
                    pre.style.position = 'relative';
                    pre.appendChild(copyBtn);
                });
            } else {
                bubble.textContent = content;
            }

            div.appendChild(label);
            div.appendChild(bubble);

            chatMessages.insertBefore(div, typing);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !currentUser) return;

            addMessage('user', text);
            messageInput.value = '';
            sendBtn.disabled = true;
            typing.style.display = 'flex';

            try {
                const thinkingMsg = document.createElement('div');
                thinkingMsg.className = 'message ai';
                const thinkingLabel = document.createElement('span');
                thinkingLabel.className = 'label';
                thinkingLabel.textContent = '🧠 PyAI';
                const thinkingBubble = document.createElement('div');
                thinkingBubble.className = 'bubble';
                thinkingBubble.style.color = '#6c757d';
                thinkingBubble.style.fontStyle = 'italic';
                thinkingBubble.textContent = '🤔 Размышляю...';
                thinkingMsg.appendChild(thinkingLabel);
                thinkingMsg.appendChild(thinkingBubble);
                chatMessages.insertBefore(thinkingMsg, typing);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: currentUser, 
                        message: text,
                        chat_id: currentChatId 
                    })
                });

                thinkingMsg.remove();
                const data = await res.json();

                if (data.success) {
                    if (data.chat_id && data.chat_id !== currentChatId) {
                        currentChatId = data.chat_id;
                        await loadChats();
                    }
                    addMessage('ai', data.response);
                    updateLimitInfo(data.remaining);
                    await loadChats();
                } else {
                    addMessage('ai', '❌ ' + data.error);
                }
            } catch (error) {
                addMessage('ai', '❌ Ошибка: ' + error.message);
            } finally {
                typing.style.display = 'none';
                sendBtn.disabled = false;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        // ============================================================
        // ДОП. ФУНКЦИИ
        // ============================================================
        async function clearChatHistory() {
            await clearCurrentChat();
        }

        function exportChat() {
            const messages = chatMessages.querySelectorAll('.message');
            let text = 'PyAI — История чата\n';
            text += '='.repeat(40) + '\n\n';
            messages.forEach(msg => {
                const label = msg.querySelector('.label');
                const bubble = msg.querySelector('.bubble');
                if (label && bubble) {
                    text += label.textContent + '\n';
                    text += bubble.textContent + '\n\n';
                }
            });
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `chat_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function logout() {
            currentUser = null;
            isAdmin = false;
            currentChatId = null;
            localStorage.removeItem('pyai_user');
            chatMessages.querySelectorAll('.message').forEach(el => el.remove());
            header.style.display = 'none';
            mainContainer.style.display = 'none';
            authContainer.style.display = 'flex';
            authUsername.value = '';
            authPassword.value = '';
            showAuthMessage('', '');
            adminPanel.classList.remove('show');
            adminSidebar.style.display = 'none';
        }

        // ============================================================
        // ОБРАБОТЧИКИ
        // ============================================================
        document.getElementById('logoutBtn').addEventListener('click', logout);
        document.getElementById('newChatBtn').addEventListener('click', createNewChat);
        switchBtn.addEventListener('click', switchMode);
        authBtn.addEventListener('click', handleAuth);
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
        authUsername.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleAuth();
        });
        authPassword.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleAuth();
        });

        // ============================================================
        // АВТОВХОД (если "Запомнить меня" был включён)
        // ============================================================
        async function autoLogin() {
            const savedUser = localStorage.getItem('pyai_user');
            if (!savedUser) return;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: savedUser, password: '' })
                });
                const data = await res.json();

                if (data.success) {
                    currentUser = savedUser;
                    showApp(data);
                    authContainer.style.display = 'none';
                    header.style.display = 'flex';
                    mainContainer.style.display = 'flex';
                    await loadChats();
                } else {
                    localStorage.removeItem('pyai_user');
                }
            } catch (e) {
                localStorage.removeItem('pyai_user');
            }
        }

        autoLogin();
    </script>
</body>
</html>
