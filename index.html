<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PyAI — Нейросеть</title>
    <style>
        /* ===== ГЛОБАЛЬНЫЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }

        /* ===== ШАПКА ===== */
        .header {
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            min-height: 50px;
            z-index: 10;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #0066ff, #4400ff);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: white;
        }

        .logo h1 {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .logo h1 span {
            color: #0066ff;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .user-info {
            font-size: 12px;
            color: #495057;
        }

        .user-info strong {
            color: #1a1a2e;
        }

        .status-badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-badge.active {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .status-badge.admin {
            background: #cce5ff;
            color: #004085;
        }

        .btn {
            padding: 4px 12px;
            border-radius: 6px;
            border: none;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #dee2e6;
            color: #495057;
        }

        .btn-outline:hover {
            background: #f1f3f5;
        }

        .btn-primary {
            background: #0066ff;
            color: white;
        }

        .btn-primary:hover {
            background: #0052cc;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
        .main-container {
            display: flex;
            flex-direction: column;
            height: calc(100% - 50px);
            overflow: hidden;
        }

        /* ===== БОКОВАЯ ПАНЕЛЬ ===== */
        .sidebar {
            display: none;
        }

        /* ===== ОСНОВНАЯ ОБЛАСТЬ ===== */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            min-height: 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        /* ===== СООБЩЕНИЯ ===== */
        .message {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            max-width: 100%;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.ai {
            align-items: flex-start;
        }

        .message .bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            max-width: 100%;
            overflow-wrap: break-word;
        }

        .message.user .bubble {
            background: #0066ff;
            color: white;
            border-bottom-right-radius: 4px;
            max-width: 85%;
        }

        .message.ai .bubble {
            background: #f1f3f5;
            color: #1a1a2e;
            border-bottom-left-radius: 4px;
            max-width: 95%;
        }

        .message .label {
            font-size: 10px;
            color: #6c757d;
            margin-bottom: 2px;
            padding: 0 4px;
        }

        /* ===== КОД ===== */
        .message .bubble pre {
            background: #1e1e2e;
            color: #cdd6f4;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 6px 0;
            position: relative;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
            max-width: 100%;
            -webkit-overflow-scrolling: touch;
        }

        .message .bubble pre code {
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 12px;
        }

        .copy-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(255, 255, 255, 0.1);
            color: #cdd6f4;
            border: none;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .copy-btn.copied {
            background: #a6e3a1;
            color: #1a1a2e;
        }

        /* ===== ТАБЛИЦЫ ===== */
        .message .bubble table {
            border-collapse: collapse;
            width: 100%;
            margin: 6px 0;
            font-size: 13px;
            display: block;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .message .bubble th,
        .message .bubble td {
            border: 1px solid #dee2e6;
            padding: 6px 10px;
            text-align: left;
            font-size: 12px;
        }

        .message .bubble th {
            background: #f1f3f5;
            font-weight: 600;
        }

        .message .bubble tr:nth-child(even) {
            background: #f8f9fa;
        }

        /* ===== ЦИТАТЫ ===== */
        .message .bubble blockquote {
            border-left: 3px solid #0066ff;
            padding: 6px 12px;
            margin: 6px 0;
            background: #f8f9fa;
            border-radius: 0 6px 6px 0;
            color: #495057;
            font-size: 13px;
        }

        /* ===== ВВОД ===== */
        .chat-input {
            padding: 10px 14px;
            border-top: 1px solid #e9ecef;
            background: #f8f9fa;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .chat-input input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #dee2e6;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            background: white;
            min-width: 0;
        }

        .chat-input input:focus {
            border-color: #0066ff;
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
        }

        .chat-input button {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            background: #0066ff;
            color: white;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .chat-input button:hover {
            background: #0052cc;
        }

        .chat-input button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== АДМИН-ПАНЕЛЬ ===== */
        .admin-panel {
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            padding: 10px 14px;
            display: none;
            flex-shrink: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .admin-panel.show {
            display: block;
        }

        .admin-panel h3 {
            font-size: 12px;
            color: #6c757d;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .admin-panel .admin-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }

        .admin-panel .admin-actions .btn {
            font-size: 11px;
            padding: 4px 12px;
        }

        .admin-panel .admin-result {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
            max-height: 100px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        /* ===== АВТОРИЗАЦИЯ ===== */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            background: #f8f9fa;
            padding: 16px;
        }

        .auth-card {
            background: white;
            border-radius: 16px;
            padding: 24px 20px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            border: 1px solid #e9ecef;
        }

        .auth-card .logo {
            justify-content: center;
            margin-bottom: 16px;
        }

        .auth-card .logo .logo-icon {
            width: 40px;
            height: 40px;
            font-size: 20px;
        }

        .auth-card .logo h1 {
            font-size: 22px;
        }

        .auth-card h2 {
            font-size: 18px;
            color: #1a1a2e;
            margin-bottom: 4px;
            text-align: center;
        }

        .auth-card p {
            color: #6c757d;
            font-size: 13px;
            text-align: center;
            margin-bottom: 16px;
        }

        .auth-card .form-group {
            margin-bottom: 12px;
        }

        .auth-card .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #495057;
            margin-bottom: 3px;
        }

        .auth-card .form-group input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .auth-card .form-group input:focus {
            border-color: #0066ff;
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
        }

        .auth-card .btn {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border-radius: 8px;
            border: none;
            background: #0066ff;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .auth-card .btn:hover {
            background: #0052cc;
        }

        .auth-card .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .auth-card .switch {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            color: #6c757d;
            cursor: pointer;
        }

        .auth-card .switch span {
            color: #0066ff;
            font-weight: 600;
        }

        .auth-card .switch span:hover {
            text-decoration: underline;
        }

        .auth-card .message {
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .auth-card .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
        }

        .auth-card .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
        }

        /* ===== АДАПТИВ ===== */
        @media (min-width: 768px) {
            .header {
                padding: 12px 24px;
                min-height: 60px;
            }

            .logo-icon {
                width: 36px;
                height: 36px;
                font-size: 18px;
            }

            .logo h1 {
                font-size: 20px;
            }

            .user-info {
                font-size: 14px;
            }

            .status-badge {
                font-size: 12px;
                padding: 4px 14px;
            }

            .btn {
                font-size: 13px;
                padding: 6px 16px;
            }

            .main-container {
                flex-direction: row;
                height: calc(100% - 60px);
            }

            .sidebar {
                display: flex;
                flex-direction: column;
                width: 220px;
                background: #f8f9fa;
                border-right: 1px solid #e9ecef;
                padding: 16px;
                overflow-y: auto;
                flex-shrink: 0;
                gap: 12px;
            }

            .sidebar-card {
                background: white;
                border-radius: 10px;
                padding: 14px;
                border: 1px solid #e9ecef;
            }

            .sidebar-card h3 {
                font-size: 11px;
                color: #6c757d;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                margin-bottom: 6px;
            }

            .sidebar-card p {
                font-size: 13px;
                color: #1a1a2e;
            }

            .sidebar-card .value {
                font-size: 16px;
                font-weight: 700;
            }

            .quick-actions {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .quick-actions button {
                padding: 8px 12px;
                border-radius: 6px;
                border: 1px solid #e9ecef;
                background: white;
                color: #1a1a2e;
                font-size: 12px;
                cursor: pointer;
                transition: 0.2s;
                text-align: left;
            }

            .quick-actions button:hover {
                background: #f1f3f5;
            }

            .chat-messages {
                padding: 20px 24px;
            }

            .message .bubble {
                font-size: 15px;
                padding: 12px 18px;
            }

            .message.ai .bubble {
                max-width: 85%;
            }

            .chat-input {
                padding: 16px 24px;
            }

            .chat-input input {
                font-size: 15px;
                padding: 12px 18px;
            }

            .chat-input button {
                padding: 12px 28px;
                font-size: 15px;
            }

            .auth-card {
                padding: 40px;
                max-width: 400px;
            }

            .admin-panel {
                padding: 12px 24px;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #dee2e6;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ced4da;
        }
    </style>
</head>
<body>

    <!-- ===== ШАПКА ===== -->
    <header class="header" id="header" style="display:none;">
        <div class="logo">
            <div class="logo-icon">Py</div>
            <h1>Py<span>AI</span></h1>
        </div>
        <div class="header-right">
            <span class="user-info" id="userInfo"><strong id="usernameDisplay"></strong></span>
            <span class="status-badge" id="statusBadge">🔴 Неактивна</span>
            <button class="btn btn-outline" id="logoutBtn">🚪</button>
        </div>
    </header>

    <!-- ===== ОСНОВНАЯ ОБЛАСТЬ ===== -->
    <div class="main-container" id="mainContainer" style="display:none;">

        <!-- Боковая панель -->
        <aside class="sidebar">
            <div class="sidebar-card">
                <h3>📊 Подписка</h3>
                <p id="sidebarPlan">Нет</p>
                <p id="sidebarDays" style="font-size:12px;color:#6c757d;"></p>
            </div>

            <div class="sidebar-card">
                <h3>📌 Действия</h3>
                <div class="quick-actions">
                    <button onclick="clearChatHistory()">🧹 Очистить память</button>
                    <button onclick="exportChat()">📥 Экспорт чата</button>
                </div>
            </div>

            <div class="sidebar-card" id="adminSidebar" style="display:none;">
                <h3>👑 Админ-панель</h3>
                <div class="quick-actions">
                    <button onclick="toggleAdminPanel()">⚙️ Открыть панель</button>
                </div>
            </div>
        </aside>

        <!-- Чат -->
        <div class="chat-area">
            <div class="chat-messages" id="chatMessages">
                <div class="message ai">
                    <span class="label">🧠 PyAI</span>
                    <div class="bubble">Привет! Я PyAI. Задавай вопросы!</div>
                </div>
                <div class="typing" id="typing"><span></span><span></span><span></span></div>
            </div>

            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Спроси у PyAI..." />
                <button id="sendBtn">➤</button>
            </div>

            <!-- Админ-панель -->
            <div class="admin-panel" id="adminPanel">
                <h3>👑 Админ-панель</h3>
                <div class="admin-actions">
                    <button class="btn btn-success" onclick="adminListUsers()">📋 Список</button>
                    <button class="btn btn-primary" onclick="adminGiveAccess()">✅ Дать доступ</button>
                    <button class="btn btn-danger" onclick="adminRemoveAccess()">❌ Отключить</button>
                    <button class="btn btn-danger" onclick="adminDeleteUser()">🗑️ Удалить</button>
                    <button class="btn btn-outline" onclick="adminStats()">📊 Статистика</button>
                </div>
                <div class="admin-result" id="adminResult">Команды админа:</div>
            </div>
        </div>
    </div>

    <!-- ===== АВТОРИЗАЦИЯ ===== -->
    <div class="auth-container" id="authContainer">
        <div class="auth-card">
            <div class="logo">
                <div class="logo-icon">Py</div>
                <h1>Py<span style="color:#0066ff;">AI</span></h1>
            </div>
            <h2 id="authTitle">Вход</h2>
            <p id="authSubtitle">Войдите в аккаунт</p>

            <div class="form-group">
                <label>👤 Имя</label>
                <input type="text" id="authUsername" placeholder="Введите имя" />
            </div>
            <div class="form-group">
                <label>🔑 Пароль</label>
                <input type="password" id="authPassword" placeholder="Введите пароль" />
            </div>

            <button class="btn" id="authBtn">Войти</button>
            <div class="switch" id="switchBtn">Нет аккаунта? <span>Зарегистрироваться</span></div>
            <div class="message" id="authMessage"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // СОСТОЯНИЕ
        // ============================================================
        let currentUser = null;
        let isLogin = true;
        let isAdmin = false;

        const ADMIN_NAME = "cursed_dev";

        // ============================================================
        // DOM
        // ============================================================
        const authContainer = document.getElementById('authContainer');
        const authTitle = document.getElementById('authTitle');
        const authSubtitle = document.getElementById('authSubtitle');
        const authUsername = document.getElementById('authUsername');
        const authPassword = document.getElementById('authPassword');
        const authBtn = document.getElementById('authBtn');
        const authMessage = document.getElementById('authMessage');
        const switchBtn = document.getElementById('switchBtn');

        const header = document.getElementById('header');
        const mainContainer = document.getElementById('mainContainer');
        const usernameDisplay = document.getElementById('usernameDisplay');
        const statusBadge = document.getElementById('statusBadge');

        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typing = document.getElementById('typing');

        const sidebarPlan = document.getElementById('sidebarPlan');
        const sidebarDays = document.getElementById('sidebarDays');
        const adminSidebar = document.getElementById('adminSidebar');
        const adminPanel = document.getElementById('adminPanel');
        const adminResult = document.getElementById('adminResult');

        // ============================================================
        // АВТОРИЗАЦИЯ
        // ============================================================
        function showAuthMessage(text, type) {
            authMessage.textContent = text;
            authMessage.className = 'message ' + type;
        }

        function switchMode() {
            isLogin = !isLogin;
            if (isLogin) {
                authTitle.textContent = 'Вход';
                authSubtitle.textContent = 'Войдите в аккаунт';
                authBtn.textContent = 'Войти';
                switchBtn.innerHTML = 'Нет аккаунта? <span>Зарегистрироваться</span>';
            } else {
                authTitle.textContent = 'Регистрация';
                authSubtitle.textContent = 'Создайте аккаунт';
                authBtn.textContent = 'Зарегистрироваться';
                switchBtn.innerHTML = 'Уже есть аккаунт? <span>Войти</span>';
            }
            showAuthMessage('', '');
        }

        async function handleAuth() {
            const username = authUsername.value.trim();
            const password = authPassword.value.trim();

            if (!username || !password) {
                showAuthMessage('Заполните все поля', 'error');
                return;
            }

            if (!isLogin && password.length < 4) {
                showAuthMessage('Пароль ≥ 4 символов', 'error');
                return;
            }

            authBtn.disabled = true;
            authBtn.textContent = '⏳';

            try {
                const endpoint = isLogin ? '/login' : '/register_web';
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    if (isLogin) {
                        currentUser = username;
                        localStorage.setItem('pyai_user', username);
                        showApp(data);
                    } else {
                        showAuthMessage('✅ ' + data.message, 'success');
                        authUsername.value = '';
                        authPassword.value = '';
                        setTimeout(() => switchMode(), 1500);
                    }
                } else {
                    showAuthMessage('❌ ' + data.error, 'error');
                }
            } catch (error) {
                showAuthMessage('❌ Ошибка: ' + error.message, 'error');
            }

            authBtn.disabled = false;
            authBtn.textContent = isLogin ? 'Войти' : 'Зарегистрироваться';
        }

        function showApp(data) {
            authContainer.style.display = 'none';
            header.style.display = 'flex';
            mainContainer.style.display = 'flex';

            usernameDisplay.textContent = data.username;

            // Проверка админа
            if (data.username === ADMIN_NAME) {
                isAdmin = true;
                statusBadge.textContent = '👑 Админ';
                statusBadge.className = 'status-badge admin';
                adminSidebar.style.display = 'block';
                adminPanel.classList.add('show');
                adminResult.textContent = '👑 Добро пожаловать, Админ!';
            } else {
                isAdmin = false;
                adminSidebar.style.display = 'none';
                adminPanel.classList.remove('show');
            }

            if (data.status === 'active') {
                if (!isAdmin) {
                    statusBadge.textContent = '🟢 Активна';
                    statusBadge.className = 'status-badge active';

        // ============================================================
        // ЧАТ
        // ============================================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatMessage(text) {
            let html = text;
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(match, lang, code) {
                return `<pre><code>${escapeHtml(code.trim())}</code><button class="copy-btn">📋</button></pre>`;
            });
            html = html.replace(/\|(.+)\|\n\|[-: |]+\|\n((?:\|.+\|\n?)+)/g, function(match, header, rows) {
                const headers = header.split('|').filter(h => h.trim());
                const rowsData = rows.trim().split('\n').map(row => row.split('|').filter(c => c.trim()));
                let tableHtml = '<table><thead><tr>';
                headers.forEach(h => { tableHtml += `<th>${escapeHtml(h.trim())}</th>`; });
                tableHtml += '</tr></thead><tbody>';
                rowsData.forEach(row => {
                    tableHtml += '<tr>';
                    row.forEach(cell => { tableHtml += `<td>${escapeHtml(cell.trim())}</td>`; });
                    tableHtml += '</tr>';
                });
                tableHtml += '</tbody></table>';
                return tableHtml;
            });
            html = html.replace(/^>\s*(.+)$/gm, '<blockquote>$1</blockquote>');
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
            html = html.replace(/^-\s*(.+)$/gm, '<li>$1</li>');
            html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
            html = html.replace(/\n/g, '<br>');
            return html;
        }

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = 'message ' + role;
            const label = document.createElement('span');
            label.className = 'label';
            label.textContent = role === 'user' ? '👤 Вы' : '🧠 PyAI';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = formatMessage(content);
            div.appendChild(label);
            div.appendChild(bubble);
            chatMessages.insertBefore(div, typing);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            bubble.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const code = this.parentElement.querySelector('code');
                    if (code) {
                        navigator.clipboard.writeText(code.textContent).then(() => {
                            this.textContent = '✅';
                            this.classList.add('copied');
                            setTimeout(() => {
                                this.textContent = '📋';
                                this.classList.remove('copied');
                            }, 2000);
                        });
                    }
                });
            });
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !currentUser) return;

            addMessage('user', text);
            messageInput.value = '';
            sendBtn.disabled = true;
            typing.style.display = 'flex';

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser, message: text })
                });
                const data = await res.json();
                if (data.success) {
                    addMessage('ai', data.response);
                } else {
                    addMessage('ai', '❌ ' + (data.error || 'Ошибка'));
                }
            } catch (error) {
                addMessage('ai', '❌ Ошибка: ' + error.message);
            } finally {
                typing.style.display = 'none';
                sendBtn.disabled = false;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        // ============================================================
        // ДОП. ФУНКЦИИ
        // ============================================================
        async function clearChatHistory() {
            if (!currentUser) return;
            try {
                const res = await fetch('/clear_history', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser })
                });
                const data = await res.json();
                if (data.success) {
                    addMessage('ai', '🧹 История очищена!');
                }
            } catch (e) { console.error(e); }
        }

        function exportChat() {
            const messages = chatMessages.querySelectorAll('.message');
            let text = 'PyAI — История чата\n';
            text += '='.repeat(40) + '\n\n';
            messages.forEach(msg => {
                const label = msg.querySelector('.label');
                const bubble = msg.querySelector('.bubble');
                if (label && bubble) {
                    text += label.textContent + '\n';
                    text += bubble.textContent + '\n\n';
                }
            });
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `chat_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function logout() {
            currentUser = null;
            isAdmin = false;
            localStorage.removeItem('pyai_user');
            chatMessages.querySelectorAll('.message').forEach(el => el.remove());
            header.style.display = 'none';
            mainContainer.style.display = 'none';
            authContainer.style.display = 'flex';
            authUsername.value = '';
            authPassword.value = '';
            showAuthMessage('', '');
            adminPanel.classList.remove('show');
            adminSidebar.style.display = 'none';
        }

        // ============================================================
        // ОБРАБОТЧИКИ
        // ============================================================
        document.getElementById('logoutBtn').addEventListener('click', logout);
        switchBtn.addEventListener('click', switchMode);
        authBtn.addEventListener('click', handleAuth);
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
        authUsername.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleAuth();
        });
        authPassword.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleAuth();
        });

        // ============================================================
        // АВТОВХОД
        // ============================================================
        async function autoLogin() {
            const savedUser = localStorage.getItem('pyai_user');
            if (!savedUser) return;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: savedUser, password: '' })
                });
                const data = await res.json();

                if (data.success) {
                    currentUser = savedUser;
                    showApp(data);
                    authContainer.style.display = 'none';
                    header.style.display = 'flex';
                    mainContainer.style.display = 'flex';
                } else {
                    localStorage.removeItem('pyai_user');
                }
            } catch (e) {
                localStorage.removeItem('pyai_user');
            }
        }

        autoLogin();
    </script>
